name: lint

on:
  # Not **.md: the prompts and default rules are .md files built into the binary.
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
