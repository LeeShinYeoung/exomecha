<?xml version="1.0" encoding="UTF-8"?>
<svg width="952" height="440" viewBox="0 0 952 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exomecha-workers-title exomecha-workers-desc">
    <title id="exomecha-workers-title">How the workers move a PRD</title>
    <desc id="exomecha-workers-desc">Swimlane with a lane for the human and one for each exomecha worker: the human writes a PRD with the draft-prd, complete-prd and summary-all-drafts skills and requests a build, builder writes the code while the PRD goes from ready to working and requests a review, reviewer reviews it in review and requests changes or a merge, resolver fixes a PR that conflicts, in review or sent back from approved, and requests a review, the human merges an approved PR or answers a stuck one.</desc>
    <defs>
    <style>
      text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
      .lane { font-size: 16px; font-weight: 600; fill: #111111; }
      .lane.human { fill: #888888; }
      .group { font-size: 12px; font-weight: 600; fill: #555555; letter-spacing: 0.04em; }
      .step { font-size: 12px; font-weight: 600; fill: #111111; text-anchor: middle; }
      .skill { font-size: 12px; fill: #555555; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace !important; }
      .say { font-size: 12px; fill: #555555; text-anchor: middle; }
      .state { font-size: 12px; fill: #888888; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace !important; }
    </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333333"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- exomecha's workers -->
    <rect x="24" y="176" width="904" height="240" rx="8" fill="#f8f8f8" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
    <g stroke="rgba(17,17,17,0.06)" stroke-width="0.8">
      <line x1="24" y1="256" x2="928" y2="256"/>
      <line x1="24" y1="336" x2="928" y2="336"/>
    </g>
    <rect x="40" y="168" width="76" height="16" fill="#ffffff"/>
    <text class="group" x="48" y="181">EXOMECHA</text>

    <text class="lane human" x="48" y="94">human</text>
    <text class="lane" x="48" y="222">builder</text>
    <text class="lane" x="48" y="302">reviewer</text>
    <text class="lane" x="48" y="382">resolver</text>

    <!-- Handoffs: forward steps go down and right, the way back goes up and left -->
    <g fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)">
      <path d="M 232,136 V 208 Q 232,216 240,216 H 360"/>
      <path d="M 432,244 V 288 Q 432,296 440,296 H 560"/>
      <line x1="600" y1="324" x2="600" y2="348"/>
      <line x1="664" y1="348" x2="664" y2="324"/>
      <line x1="532" y1="176" x2="532" y2="116"/>
    </g>
    <path d="M 632,268 V 224 Q 632,216 624,216 H 504"
          fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- An approved PRD whose PR conflicts goes back to review for resolver -->
    <path d="M 872,116 V 368 Q 872,376 864,376 H 704"
          fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M 704,296 H 824 Q 832,296 832,288 V 116"
          fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <text class="say" x="300" y="204">Request a build</text>
    <text class="say" x="496" y="284">Request a review</text>
    <text class="say" x="564" y="236">Request changes</text>
    <text class="say" x="764" y="284" style="fill:#000000">Request a merge</text>
    <text class="say" x="588" y="340" style="text-anchor:end">PR conflicts</text>
    <text class="say" x="676" y="340" style="text-anchor:start">Request a review</text>
    <text class="say" x="788" y="368">PR conflicts</text>
    <text class="say" x="544" y="152" style="text-anchor:start">Ask a question</text>

    <!-- Human's steps -->
    <rect x="144" y="40" width="176" height="96" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <text class="step" x="160" y="62" style="text-anchor:start">Write a PRD</text>
    <line x1="160" y1="72" x2="304" y2="72" stroke="rgba(17,17,17,0.08)" stroke-width="0.8"/>
    <text class="skill" x="160" y="92">/draft-prd</text>
    <text class="skill" x="160" y="108">/complete-prd</text>
    <text class="skill" x="160" y="124">/summary-all-drafts</text>

    <rect x="460" y="60" width="144" height="56" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4,3"/>
    <text class="step" x="532" y="82">Answer</text>
    <text class="state" x="532" y="100">stuck</text>

    <rect x="760" y="60" width="144" height="56" rx="8" fill="#000000"/>
    <text class="step" x="832" y="82" style="fill:#ffffff">Merge PR</text>
    <text class="state" x="832" y="100" style="fill:rgba(255,255,255,0.72)">approved</text>

    <!-- Workers' steps, each with the status the PRD has while it runs -->
    <g fill="#ffffff" stroke="#111111" stroke-width="1">
      <rect x="360" y="188" width="144" height="56" rx="8"/>
      <rect x="560" y="268" width="144" height="56" rx="8"/>
      <rect x="560" y="348" width="144" height="56" rx="8"/>
    </g>
    <text class="step" x="432" y="210">Write code</text>
    <text class="state" x="432" y="228">ready → working</text>
    <text class="step" x="632" y="290">Review PR</text>
    <text class="state" x="632" y="308">review</text>
    <text class="step" x="632" y="370">Fix conflict</text>
    <text class="state" x="632" y="388">review</text>

  </svg>
